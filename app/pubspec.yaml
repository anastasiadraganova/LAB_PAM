name: eventhub
description: "EventHub — афиша городских событий с покупкой билетов."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Versions are pinned exactly: the build must be reproducible across machines.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # Typography: Fira Sans Extra Condensed and Manrope.
  google_fonts: 8.2.1

  # Navigation.
  go_router: 18.0.1

  # State management.
  flutter_riverpod: 3.4.3

  # HTTP client for the backend API.
  dio: 5.11.1

  # Event posters with placeholder, fallback and disk cache.
  cached_network_image: 4.0.0

  # Local storage: listing cache and JWT.
  shared_preferences: 2.5.5
  flutter_secure_storage: 11.2.0

  # Date, time and price formatting.
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
